<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>W3school home page</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }
      .hider {
        display: flex;        
        align-items: center;
      }
      .menoo {
        list-style: none;
        margin-left: 15px;
      }
      .menoo li {
        display: inline-block;
      }
      .menoo li a {
        text-decoration: none;
        display: inherit;
        padding: 20px 10px;
        color: #282a36;
        font-weight: 560;
        font-size: 14px;
      }
      .menoo li a:hover {
        color: #ffffff;
        background-color: #03ab6d;
      }
      .home {
        position: relative;
        background-color: #282a36;
        height: 500px;
        overflow: hidden;
      }
      .course{
        width: 50%;
        position: absolute;
        left: 0; top: 60px;
        text-align: center;
        color: #ffffff;
      }
      .course h1{ 
        display: inline-block;
        font-size: 110px;
        margin-bottom: 10px;        
        animation: colorit 15s infinite;                        
      }      
      @keyframes colorit{
        0%,30%{ text-shadow: 0 0 15px #ff006a;}
        60%{ text-shadow: 1px 1px 10px #006eff;}
        100%{ text-shadow: 0 0 8px #fbff00;}
      }
      .course button,.exabox button{        
        width: 160px;
        padding: 10px 0;
        margin-top: 15px;
        font-weight: 560;
        border-radius: 20px;
        border: none;
      }
      .example{
        width: 50%;
        position: absolute;
        right: 0; top: 50px;
      }
      .exabox{
        width: 450px;
        background-color: #e6e8eb;
        border-radius: 4px;
        padding: 20px 15px;
      }
      .codz{
        background-color: #ffffff;
        border-left: 5px solid #03ab6d;
        margin: 10px 0;
        padding: 20px 15px;
      }
      .btn{
        color: #ffffff;
        background-color: #03ab6d;
      }
    </style>
  </head>
  <body>
    <div class="hider">
      <img src="../../images/w3logo.png" alt="" />
      <ul class="menoo">
        <li><a href="">Tutorials</a></li>
        <li><a href="">References</a></li>
        <li><a href="">Exersices</a></li>
      </ul>
    </div>
    <div class="home">
      <div class="course">
        <h1>HTML</h1>
        <p style="font-family: AradVF,sans-serif;">The language for building web pages</p>
        <button class="btn">Learn HTML</button><br>
        <button>HTML References</button>
      </div>
      <div class="example">
        <div class="exabox">
            <h3 style="font-family: AradVF,sans-serif;">HTML Example</h3>
            <div class="codz">
                &lt;!DOCTYPE <span style="color:red">html</span>&gt;<br>
                &lt;html&gt;<br>
                &lt;title&gt;HTML Tutorial&lt;/title&gt;<br>
                &lt;body&gt;<br><br>
                &lt;h1&gt;This is a heading&lt;/h1&gt;<br>
                &lt;p&gt;This is a paragraph.&lt;/p&gt;<br><br>
                &lt;/body&gt;<br>
                &lt;/html&gt;
            </div>
            <button class="btn">Try it Yourself</button>
        </div>
      </div>
    </div>
  </body>
</html>
