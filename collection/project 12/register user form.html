<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://kit.fontawesome.com/af69fc4c65.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="register user form.css">
</head>
<body>
    <div class="container">
        <form action="" class="myForm">
            <input type="text" name="name" placeholder="UserName" autofocus required autocomplete="off"><br>
            <input type="password" name="password" placeholder="PassWord" required><br>
            <button type="submit">Login</button>           
        </form>
        
        <p class="mas">don't have an account?<a href="#"> Sign up</a></p>
        <i class="fas fa-coffee" style="font-size: medium; color: #27374D; margin-top: 20px;"></i>
    </div>
</body>
</html>
